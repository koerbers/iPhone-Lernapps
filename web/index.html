<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Sicherheitsregeln: nur eigene Dateien, Texterkennung/PDF vom CDN jsDelivr und die Claude-API sind erlaubt.
       'unsafe-eval' und child-src braucht Safari für die Texterkennung (WebAssembly im Worker) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' blob: https://cdn.jsdelivr.net; child-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https://api.anthropic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vokabeltrainer</title>
  <meta name="description" content="Vokabeln lernen für Englisch und Latein">
  <meta name="theme-color" content="#2a78d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vokabeln">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" class="page"></main>

  <!-- Vollbild-Ebene für Übungsrunden -->
  <div id="overlay" class="overlay" hidden></div>

  <nav class="tabbar" aria-label="Hauptmenü">

    <a href="#/listen" data-tab="listen"><span>📚</span>Vokabeln</a>
    <a href="#/erfolge" data-tab="erfolge"><span>📊</span>Erfolge</a>
    <a href="#/einstellungen" data-tab="einstellungen"><span>⚙️</span>Einstellungen</a>
  </nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
