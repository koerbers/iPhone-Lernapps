# Baut die installierbare App (Ordner app/) aus der Web-App:
# - Android: fertige APK zum Herunterladen (unter „Actions“ → Lauf → „Artifacts“)
# - iOS: prüft, dass das Xcode-Projekt baut (zum Installieren braucht es später ein Apple-Entwicklerkonto)
name: App bauen (Android/iOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['web/**', 'app/**', '.github/workflows/app.yml']

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci
      - name: Android-Projekt erzeugen
        working-directory: app
        run: npm run android
      - name: APK bauen
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Vokabeltrainer-Android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci
      - name: iOS-Projekt erzeugen
        working-directory: app
        run: npm run ios
      - name: Für den Simulator bauen (ohne Signatur)
        working-directory: app/ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
