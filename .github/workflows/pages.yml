# Veröffentlicht die Web-App (Ordner web/) auf GitHub Pages,
# sobald etwas auf den Branch "main" kommt.
name: Web-App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grundsätzlich nur lesen; Schreibrechte bekommt nur der Schritt, der veröffentlicht
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests der Lernlogik
        run: node --test web/tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
